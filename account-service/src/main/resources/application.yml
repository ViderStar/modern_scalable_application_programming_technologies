server:
  port: ${ACCOUNT_SERVICE_PORT:8082}

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:h2:mem:accounts;DB_CLOSE_DELAY=-1
    username: sa
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true

bank:
  fund:
    # Стартовый капитал фонда развития банка по валютам (ЛР2 — 1 млн BYN, ЛР3 — 100 млрд BYN)
    capital:
      BYN: ${BANK_FUND_CAPITAL_BYN:100000000000}
      USD: 5000000
      EUR: 5000000
  day-close:
    # Сервисы, которые обрабатывают открытие нового банковского дня: начисляют проценты, проводят платежи
    participants:
      - name: Депозиты
        url: ${DEPOSIT_SERVICE_URL:http://localhost:8083}
      - name: Кредиты
        url: ${CREDIT_SERVICE_URL:http://localhost:8084}
