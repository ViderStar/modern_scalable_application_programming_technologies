server:
  port: ${CLIENT_SERVICE_PORT:8081}

spring:
  application:
    name: client-service
  datasource:
    # База в памяти: создаётся и заполняется при каждом старте (schema.sql + data.sql)
    url: jdbc:h2:mem:clients;DB_CLOSE_DELAY=-1
    username: sa
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true          # http://localhost:8081/h2-console — проверка таблиц «прямо в базе»
  jackson:
    deserialization:
      fail-on-unknown-properties: false
