server:
  port: ${CREDIT_SERVICE_PORT:8084}

spring:
  application:
    name: credit-service
  datasource:
    url: jdbc:h2:mem:credits;DB_CLOSE_DELAY=-1
    username: sa
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true
  http:
    client:
      connect-timeout: 2s
      read-timeout: 120s

bank:
  services:
    clients: ${CLIENT_SERVICE_URL:http://localhost:8081}
    accounts: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    deposits: ${DEPOSIT_SERVICE_URL:http://localhost:8083}
  demo:
    # Демо-карты для знакомства с банкоматом: после старта заключаются кредитные договоры,
    # их картам назначаются PIN-коды из этого списка. Отключается BANK_DEMO_ENABLED=false
    enabled: ${BANK_DEMO_ENABLED:true}
    cards:
      - { contract: К-900001, client-id: 1, product-id: 1, amount: 5000, term-months: 12, pin: "1111" }
      - { contract: К-900002, client-id: 2, product-id: 2, amount: 3000, term-months: 12, pin: "2222" }
      - { contract: К-900003, client-id: 5, product-id: 1, amount: 10000, term-months: 24, pin: "3333" }
